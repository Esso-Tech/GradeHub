# HTTPS Let's Encrypt (nécessite DOMAIN + CERTBOT_EMAIL dans .env.deploy)
# Premier lancement : ./scripts/init-letsencrypt.sh sur la VM

services:
  certbot:
    image: certbot/certbot:v3.0.1
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done"

  frontend:
    ports: !override
      - "80:80"
      - "443:443"
    volumes:
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro

  backend:
    environment:
      CORS_ORIGIN: https://${DOMAIN:?DOMAIN requis pour SSL}

volumes:
  certbot-etc:
  certbot-www:
