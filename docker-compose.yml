services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: gradehub
      POSTGRES_PASSWORD: gradehub
      POSTGRES_DB: gradehub
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://gradehub:gradehub@db:5432/gradehub
    depends_on: [db]
    ports: ["4000:4000"]
    volumes: ["./backend/uploads:/app/uploads"]

volumes:
  pgdata:
